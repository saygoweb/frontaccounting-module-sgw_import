name: CI

# Runs tools/ci.sh in the FrontAccounting CI image (cambell-prince/frontaccounting
# docker/ci), on FrontAccounting's demo company, with graphql and sgw_sales
# activated alongside, as they are deployed; coverage from one cell.

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        fa: [cp, upstream]
        php: ['7.4', '8.3']
    uses: cambell-prince/frontaccounting/.github/workflows/plugin-test.yml@master-cp
    with:
      fa: ${{ matrix.fa }}
      php: ${{ matrix.php }}
      dataset: demo
      setup: composer install --no-interaction --no-progress
      # Activated with the modules it is deployed with: they share one PHP
      # process, and so one Anorm (see tools/ci.sh). graphql's Bootstrap also
      # loads FrontAccounting for the integration suite.
      with: |
        graphql=https://github.com/saygoweb/frontaccounting-module-graphql.git@main
        sgw_sales=https://github.com/saygoweb/frontaccounting-module-sgw_sales.git@master
      test: sh tools/ci.sh

  # Coverage for the README's badge: tools/coverage.sh in one cell, its Clover
  # report sent to Codecov by plugin-test.yml.
  coverage:
    uses: cambell-prince/frontaccounting/.github/workflows/plugin-test.yml@master-cp
    with:
      fa: cp
      php: '8.3'
      dataset: demo
      setup: composer install --no-interaction --no-progress
      with: |
        graphql=https://github.com/saygoweb/frontaccounting-module-graphql.git@main
        sgw_sales=https://github.com/saygoweb/frontaccounting-module-sgw_sales.git@master
      test: sh tools/coverage.sh
      coverage: build/coverage.xml
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
